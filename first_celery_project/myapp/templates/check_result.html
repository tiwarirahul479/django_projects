<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
</head>
<body>
    <h2>Result Page</h2>
    <nav>
        <ul>
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </nav>
    <hr>
    {% if result %}
        <p>ID: {{ result.id }}</p>
        <p>Task ID: {{ result.task_id }}</p>
        <p>Task State: {{ result.state }}</p>
        <p>Task Status: {{ result.status }}</p>
        <p>Task Result: {{ result.result }}</p>
    {% endif %}
</body>
</html>
