{% extends "base.html" %}
{% block start %}

<div class="receipe_breadcrumb">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Receipes</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{recepie_data.receipe_name}}</li>
      </ol>
    </nav>
  </div>
<div class="d-flex shadow-lg p-3">
    <div class="col-2">
        <img src="/media/{{recepie_data.receipe_image}}" alt="Not Found" width="150" height="150">
    </div>
    <div class="col-10">
        <p style="font-size: 40px; font-weight: 700;">{{recepie_data.receipe_name}}</p>
        <p style="font-size: 24px; font-weight: 400;" class="text-muted">{{recepie_data.receipe_description}}</p>
    </div>
</div>

{% endblock %}
