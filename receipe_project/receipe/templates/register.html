{% extends "base.html" %}
{% block start %}

<div class="d-flex flex-column justify-content-center align-items-center">
    <h2 class="col-6">Register</h2>
    <form class="col-6 my-3 card p-3 shadow-lg" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {% if messages %}
        {{messages.tags}}
        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
            {{message}}
            {% endfor %}
        </div>
        {% endif %}

        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" required name="first_name">
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" required name="last_name">
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="email" class="form-control" id="username" required name="username" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" required class="form-control" id="password">
        </div>
        <button type="submit" class="btn btn-success">Register</button>
        <p class="text-center mt-2">Already registered, go back to <a href="/login">Login</a> page</p>
    </form>
</div>

{% endblock %}
