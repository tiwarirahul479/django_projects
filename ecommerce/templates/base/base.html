<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

    <title>{{page}}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light text-secondary">
        <div class="container container-fluid">
          <a class="navbar-brand text-secondary" href="/">Ecommerce</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link text-secondary active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-secondary" aria-current="page" href="/shop">Shop</a>
              </li>
              <!-- <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-secondary" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Fun with Receipes
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="/receipes/add/">Add Receipes</a></li>
                </ul>
              </li> -->
            </ul>
            <span class="float-end">
              {% if request.user.is_authenticated %}
              <a class="btn btn-outline-secondary" href="/logout">Logout</a>
              {% else %}
              <a class="btn btn-outline-secondary" href="/login">Login</a>
              <a class="btn btn-outline-secondary" href="/register">Register</a>
              {% endif %}
            </span>
          </div>
        </div>
      </nav>
      <div class="container my-3" style="min-height: 74vh;">
        {% block start %}
      
        {% endblock %}
      </div>
        
      <footer class="mt-5 bg-dark text-light py-3">
        <div class="container">
          <p class="text-center">ecommerce.com &copy; All rights reserved.</p>
        </div>
      </footer>

  </body>
</html>
